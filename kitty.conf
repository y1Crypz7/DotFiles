# ~/.config/kitty/kitty.conf
# --- SHELL ---
shell /usr/bin/zsh
# --- FONTES ---
font_family      MesloLGM Nerd Font Mono
bold_font        MesloLGM Nerd Font Mono Bold
italic_font      MesloLGM Nerd Font Mono Italic
font_size        20.0

# Remova a seção duplicada "BEGIN_KITTY_FONTS" (ela está sobrescrevendo suas configurações)

# --- TRANSPARÊNCIA ---
# 0.0 (transparente) a 1.0 (opaco)
background_opacity    0.85  
# Diminui opacidade ao digitar
dynamic_background_opacity yes  

# --- CORES ---
background       #1e1e2e
foreground       #cdd6f4
cursor           #f5e0dc

# Cursor e seleção
cursor_shape     beam
selection_foreground #1e1e2e
selection_background #f5e0dc

# --- LAYOUT ---
enabled_layouts  splits:split_axis=vertical
#Espaçamento interno
window_padding_width 5   

# --- TAB BAR ---
tab_bar_style    powerline
tab_powerline_style slanted
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# --- PERFORMANCE ---
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- INTEGRAÇÃO ---
term xterm-kitty
shell_integration enabled

# --- ATALHOS ÚTEIS ---
map ctrl+shift+equal    increase_font_size
map ctrl+shift+minus    decrease_font_size
map ctrl+shift+backspace restore_font_size

# --- LAG NO CURSOR --- #
cursor_trail 3
cursor_trail_decay 0.1 0.4